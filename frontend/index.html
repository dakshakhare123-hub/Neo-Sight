<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NeoScan — Intelligent Neonatal Bilirubin Screening</title>
  
  <!-- Brand Favicons & PWA Manifest -->
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4C2365" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="NeoScan: Lighting-robust neonatal jaundice screening companion using smartphone optics and clinical color calibration." />
  
  <!-- Tailwind CSS (Local first, CDN fallback) -->
  <script src="/app/vendor/tailwind.min.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
  
  <!-- Tailwind CSS Configuration & Design Tokens -->
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            plum: {
              50: '#F7F3FA',
              100: '#EFE8F5',
              200: '#E2D5EC',
              300: '#D4C2E3',
              400: '#C4A4DA', // Lavender
              500: '#9E7EB5', // Soft Violet
              600: '#856E91',
              700: '#725B7E',
              800: '#5D2F7B',
              900: '#4C2365', // Deep Plum
              950: '#2A1138', // Deep Plum Black
            },
            violet: {
              50: '#F7F4FA',
              100: '#EFE9F5',
              200: '#DFCDEB',
              300: '#C4A4DA', // Lavender
              400: '#B08FC9',
              500: '#9E7EB5', // Soft Violet
              600: '#8E6CA7',
              700: '#7F5D99', // Violet
              800: '#674780',
              900: '#4C2365', // Deep Plum
            },
            lavender: {
              50: '#FAF7FC',
              100: '#F4EDF8',
              200: '#E8DDF0',
              300: '#C4A4DA', // Lavender
              400: '#B591CF',
              500: '#9E7EB5', // Soft Violet
              600: '#86649E',
              700: '#7F5D99', // Violet
            },
            clinical: {
              danger: '#8F1D40',     // Crimson-Plum (Danger / Elevated Jaundice)
              dangerBg: '#FDF2F4',
              dangerBorder: '#F5C2CD',
              warning: '#9E5700',    // Amber-Gold (Warning / Inconclusive)
              warningBg: '#FEF9F0',
              warningBorder: '#F5DEC2',
              success: '#1E6F43',    // Sage-Emerald (Success / Routine Observation)
              successBg: '#F0F8F3',
              successBorder: '#C2E2CF',
            }
          }
        }
      }
    };
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM (Local first, CDN fallback) -->
  <script src="/app/vendor/react.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="/app/vendor/react-dom.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --color-deep-plum: #4C2365;
      --color-violet: #7F5D99;
      --color-soft-violet: #9E7EB5;
      --color-lavender: #C4A4DA;
      --color-plum-black: #2A1138;
      --color-page-bg: #F7F3FA;
      --color-surface: #FFFFFF;
      --color-surface-subtle: #EFE8F5;
      --color-border-subtle: #E8DEEF;
      --color-border-medium: #D4C2E3;
      --color-text-primary: #2A1138;
      --color-text-secondary: #5E4968;
      --color-text-muted: #725B7E;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #F7F3FA;
      color: #2A1138;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    
    /* Mobile Safe Area Padding Utilities */
    .safe-top {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }
    .safe-left {
      padding-left: max(1rem, env(safe-area-inset-left));
    }
    .safe-right {
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    /* Prevent automatic iOS Safari zoom on focus by enforcing >=16px inputs */
    @media (max-width: 768px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }

    /* Primary Clinical Plum-Violet Brand Gradients & Elements */
    .bg-gradient-to-r.from-plum-900.to-violet-700,
    .bg-gradient-to-tr.from-plum-900.to-violet-700,
    .btn-plum-primary,
    .avatar-plum-gradient {
      background: linear-gradient(135deg, #4C2365 0%, #7F5D99 100%) !important;
      color: #FFFFFF !important;
    }
    .bg-gradient-to-r.from-plum-900.to-violet-700:hover,
    .btn-plum-primary:hover {
      background: linear-gradient(135deg, #2A1138 0%, #674780 100%) !important;
    }

    /* Core Palette Fail-Safe Utilities */
    .bg-plum-900 { background-color: #4C2365 !important; }
    .bg-plum-950 { background-color: #2A1138 !important; }
    .bg-plum-800 { background-color: #5D2F7B !important; }
    .bg-plum-700 { background-color: #725B7E !important; }
    .bg-plum-500 { background-color: #9E7EB5 !important; }
    .bg-plum-200 { background-color: #E2D5EC !important; }
    .bg-plum-100 { background-color: #EFE8F5 !important; }
    .bg-plum-50  { background-color: #F7F3FA !important; }

    .text-plum-950 { color: #2A1138 !important; }
    .text-plum-900 { color: #4C2365 !important; }
    .text-plum-800 { color: #5D2F7B !important; }
    .text-plum-700 { color: #725B7E !important; }
    .text-plum-600 { color: #856E91 !important; }
    .text-plum-500 { color: #9E7EB5 !important; }
    .text-plum-400 { color: #C4A4DA !important; }
    .text-plum-300 { color: #D4C2E3 !important; }
    .text-plum-200 { color: #E2D5EC !important; }

    .border-plum-900 { border-color: #4C2365 !important; }
    .border-plum-200 { border-color: #E2D5EC !important; }
    .border-plum-100 { border-color: #EFE8F5 !important; }
    .border-lavender-300 { border-color: #C4A4DA !important; }
    .border-lavender-200 { border-color: #E8DDF0 !important; }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F7F3FA;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #C4A4DA;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #9E7EB5;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .animate-heartbeat {
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-plum-900 selection:text-white bg-plum-50 text-plum-950 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col">
    <!-- Initial Loading State (Replaced immediately when React mounts) -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F3FA; color: #5E4968; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
      <div style="text-align: center; max-width: 320px; padding: 24px;">
        <div style="margin: 0 auto 14px; display: inline-flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 6px rgba(76, 35, 101, 0.15));">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="56" height="56" fill="none" role="img" aria-label="NeoScan Logo Mark">
            <defs>
              <linearGradient id="shieldGradSplash" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4C2365"/>
                <stop offset="50%" stop-color="#6B3A8B"/>
                <stop offset="100%" stop-color="#7F5D99"/>
              </linearGradient>
              <linearGradient id="irisGradSplash" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#C4A4DA"/>
                <stop offset="100%" stop-color="#9E7EB5"/>
              </linearGradient>
              <radialGradient id="amberCoreSplash" cx="24" cy="24" r="6" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FDE047"/>
                <stop offset="60%" stop-color="#F59E0B"/>
                <stop offset="100%" stop-color="#D97706"/>
              </radialGradient>
            </defs>
            <rect x="4" y="4" width="40" height="40" rx="14" fill="url(#shieldGradSplash)"/>
            <rect x="4.5" y="4.5" width="39" height="39" rx="13.5" stroke="#C4A4DA" stroke-opacity="0.3" stroke-width="1"/>
            <circle cx="24" cy="24" r="12" stroke="url(#irisGradSplash)" stroke-width="2.5" stroke-dasharray="14 4" stroke-linecap="round"/>
            <line x1="24" y1="7" x2="24" y2="10" stroke="#C4A4DA" stroke-width="2" stroke-linecap="round"/>
            <line x1="24" y1="38" x2="24" y2="41" stroke="#C4A4DA" stroke-width="2" stroke-linecap="round"/>
            <line x1="7" y1="24" x2="10" y2="24" stroke="#C4A4DA" stroke-width="2" stroke-linecap="round"/>
            <line x1="38" y1="24" x2="41" y2="24" stroke="#C4A4DA" stroke-width="2" stroke-linecap="round"/>
            <circle cx="24" cy="24" r="5.5" fill="url(#amberCoreSplash)"/>
            <path d="M21.5 24.5C21.5 22.8 24 21.2 24 21.2C24 21.2 26.5 22.8 26.5 24.5Z" fill="#FFFFFF" fill-opacity="0.95"/>
          </svg>
        </div>
        <div style="font-size: 20px; font-weight: 800; color: #2A1138; letter-spacing: -0.02em;">NeoScan</div>
        <div style="display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #4C2365; background: #EFE8F5; border: 1px solid #D4C2E3; border-radius: 9999px; padding: 2px 8px; margin-top: 4px;">Pediatric Screening</div>
        <div style="width: 32px; height: 32px; border: 2.5px solid #EFE8F5; border-top-color: #7F5D99; border-radius: 50%; margin: 20px auto 12px; animation: spin 0.9s linear infinite;"></div>
        <div style="font-size: 12px; color: #725B7E;">Initializing medical vision & calibration engine...</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Pre-compiled, Crash-proof Native React Application -->
  <script src="/app/app.js"></script>

  <!-- Service Worker Registration for PWA Offline Reliability -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('[NeoScan PWA] ServiceWorker registration successful with scope: ', reg.scope);
          })
          .catch(function(err) {
            console.warn('[NeoScan PWA] ServiceWorker registration notice: ', err);
          });
      });
    }
  </script>
</body>
</html>
