  <!-- Tailwind CSS Configuration & Design Tokens -->

              500: '#9E7EB5', // Soft Violet
              600: '#856E91',
              700: '#725B7E',
              800: '#5D2F7B',

              950: '#2A1138', // Deep Plum Black
            },
            violet: {
              50: '#F7F4FA',
              100: '#EFE9F5',

              400: '#B08FC9',

              600: '#8E6CA7',
              700: '#7F5D99', // Violet
              800: '#674780',
              900: '#4C2365', // Deep Plum
            },
            lavender: {

  <!-- Tailwind CSS (Local first, CDN fallback) -->
  <script src="/app/vendor/tailwind.min.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- React 18 & ReactDOM (Local first, CDN fallback) -->
  <script src="/app/vendor/react.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="/app/vendor/react-dom.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>

  <style>
    :root {
      --color-deep-plum: #4C2365;
      --color-violet: #7F5D99;
      --color-soft-violet: #9E7EB5;
      --color-lavender: #C4A4DA;
      --color-plum-black: #2A1138;
      --color-page-bg: #F7F3FA;
      --color-surface: #FFFFFF;
      --color-surface-subtle: #EFE8F5;
      --color-border-subtle: #E8DEEF;
      --color-border-medium: #D4C2E3;
      --color-text-primary: #2A1138;
      --color-text-secondary: #5E4968;
      --color-text-muted: #725B7E;
    }
    body {
      background-color: #F7F3FA;
      color: #2A1138;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F7F3FA;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #C4A4DA;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #9E7EB5;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .animate-heartbeat {
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-plum-900 selection:text-white bg-plum-50 text-plum-950 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col">
    <!-- Initial Loading State (Replaced immediately when React mounts) -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F3FA; color: #5E4968; font-family: sans-serif;">
      <div style="text-align: center;">
        <div style="width: 52px; height: 52px; border: 3px solid #EFE8F5; border-top-color: #4C2365; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite;"></div>
        <div style="font-size: 17px; font-weight: 600; color: #2A1138; letter-spacing: -0.01em;">NeoScan Pediatric Screening</div>
        <div style="font-size: 13px; color: #725B7E; margin-top: 6px;">Initializing medical vision & calibration engine...</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Pre-compiled, Crash-proof Native React Application -->
  <script src="/app/app.js"></script>
</body>
</html>
