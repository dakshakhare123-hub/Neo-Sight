<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeoScan — Intelligent Neonatal Bilirubin Screening</title>
  
  <!-- Tailwind CSS (Local first, CDN fallback) -->
  <script src="/app/vendor/tailwind.min.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM (Local first, CDN fallback) -->
  <script src="/app/vendor/react.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="/app/vendor/react-dom.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .animate-heartbeat {
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-teal-500 selection:text-white bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col">
    <!-- Initial Loading State (Replaced immediately when React mounts) -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #64748b; font-family: sans-serif;">
      <div style="text-align: center;">
        <div style="width: 52px; height: 52px; border: 3px solid #ccfbf1; border-top-color: #0d9488; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite;"></div>
        <div style="font-size: 17px; font-weight: 600; color: #0f172a; letter-spacing: -0.01em;">NeoScan Pediatric Screening</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 6px;">Initializing medical vision & calibration engine...</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Pre-compiled, Crash-proof Native React Application -->
  <script src="/app/app.js"></script>
</body>
</html>
