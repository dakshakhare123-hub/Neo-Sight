<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeoScan — Lighting-Robust Neonatal Jaundice Screening</title>
  
  <!-- Tailwind CSS (Local first, CDN fallback) -->
  <script src="/app/vendor/tailwind.min.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM (Local first, CDN fallback) -->
  <script src="/app/vendor/react.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="/app/vendor/react-dom.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>

  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="antialiased selection:bg-sky-500 selection:text-white bg-slate-950">
  <div id="root">
    <!-- Initial Loading State (Replaced immediately when React mounts) -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #94a3b8; font-family: sans-serif;">
      <div style="text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #0284c7; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite;"></div>
        <div style="font-size: 16px; font-weight: 600; color: #f8fafc;">Loading NeoScan Screening Engine...</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Initializing computer vision modules</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Pre-compiled, Crash-proof Native React Application -->
  <script src="/app/app.js"></script>
</body>
</html>
